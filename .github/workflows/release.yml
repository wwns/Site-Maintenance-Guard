name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Build distribution ZIP
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          mkdir -p dist
          python3 - "$VERSION" <<'PY'
          import os, sys, zipfile

          version = sys.argv[1]
          root = os.getcwd()
          with open(".distignore", "r", encoding="utf-8") as f:
              ignores = {line.strip().rstrip("/") for line in f if line.strip() and not line.strip().startswith("#")}

          zip_path = os.path.join(root, "dist", f"gatedevx-maintenance-guard-{version}.zip")
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for dirpath, dirnames, filenames in os.walk(root):
                  rel_dir = os.path.relpath(dirpath, root)
                  if rel_dir == ".":
                      dirnames[:] = [d for d in sorted(dirnames) if d not in ignores]
                  else:
                      top = rel_dir.split(os.sep)[0]
                      if top in ignores:
                          dirnames[:] = []
                          continue
                  for fname in sorted(filenames):
                      if rel_dir == "." and fname in ignores:
                          continue
                      full_path = os.path.join(dirpath, fname)
                      rel_path = os.path.relpath(full_path, root)
                      arcname = os.path.join("gatedevx-maintenance-guard", rel_path)
                      zf.write(full_path, arcname)
          print("Built:", zip_path)
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            "dist/gatedevx-maintenance-guard-${VERSION}.zip" \
            --title "Gatedevx Maintenance Guard $TAG_NAME" \
            --generate-notes
